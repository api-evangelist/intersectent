name: Intersect ENT
description: 'Intersect ENT (the "Intersectent" stub) was a Menlo Park, California medical-device
  company that developed steroid-releasing dissolvable sinus implants — the PROPEL and PROPEL
  mini families and the SINUVA implant — to improve outcomes for chronic sinusitis and ear,
  nose and throat surgery. Backed by Norwest Venture Partners (Series D lead), Kleiner Perkins,
  U.S. Venture Partners and Medtronic, it went public and was acquired by Medtronic on
  2022-05-13 for roughly $1.1B, with the FTC-mandated divestiture of its Fiagon products.
  It is a physical medical-device business with no developer platform, public API, SDK, or
  developer portal; intersectent.com now redirects to Medtronic''s PROPEL product page. This
  record is retained for lineage from the Norwest portfolio harvest and is not an API provider.'
